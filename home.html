<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ThreatGuard | Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #1e293b;
            color: #ffffff;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background-color: #020617;
        }

        .navbar h2 {
            margin: 0;
            color: #38bdf8;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
        }

        .navbar a:hover {
            color: #38bdf8;
        }

        /* Hero Section */
        .hero {
            height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex-direction: column;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 48px;
            color: #38bdf8;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 18px;
            max-width: 600px;
            margin-bottom: 25px;
            color: #e5e7eb;
        }

        .btn {
            background-color: #22c55e;
            color: #000;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #16a34a;
        }

        /* Footer */
        footer {
            background-color: #020617;
            text-align: center;
            padding: 12px;
            color: #9ca3af;
        }
        
.circle {
    position: absolute;
    width: 120px;
    height: 120px;
    background: rgba(56,189,248,0.3);
    border-radius: 50%;
    animation: float 6s ease-in-out infinite;
}

.circle:nth-child(1) { top: 20%; left: 10%; animation-delay: 0s; }
.circle:nth-child(2) { top: 60%; left: 70%; animation-delay: 2s; }
.circle:nth-child(3) { top: 40%; left: 40%; animation-delay: 4s; }

@keyframes float {
    0%   { transform: translateY(0); }
    50%  { transform: translateY(-30px); }
    100% { transform: translateY(0); }
}
    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <h2>ThreatGuard</h2>
        <div>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
    </div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>

    <h1 style="position:absolute;top:40%;left:50%;transform:translate(-50%,-50%)">
        Welcome to ThreatGuard
    </h1>

    <!-- Hero Section -->
    <section class="hero">
        <h1>ThreatGuard</h1>
        <p>
            Detect malicious URLs and spam PDF files using intelligent threat analysis.
            Stay safe from phishing, malware, and cyber threats.
        </p>
        <a href="{{ url_for('start') }}" class="btn">Get Started</a>
    </section>

    <!-- Footer -->
    <footer>
        © 2026 ThreatGuard | Cybersecurity Web Application
    </footer>

</body>
</html>
