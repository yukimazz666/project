<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"  name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreatGuard</title>
    <style>
        body {
            background: linear-gradient(120deg, #0f2027, #203a43, #2c5364);
            font-family: Arial, sans-serif;
            color: white;
        }
        .container {
            width: 400px;
            margin: 80px auto;
            background: #111827;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
        }
        h1 {
            text-align: center;
            color: #38bdf8;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            border: none;
        }
        button {
            background: #22c55e;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            background: #020617;
            border-left: 4px solid #22c55e;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>ThreatGuard</h1>

    <!-- File Detection -->
    <form method="POST" enctype="multipart/form-data">
        <h3>Malicious File Detection</h3>
        <input type="file" name="file" required accept=".pdf, .txt">
        <button type="submit" name="analyze_file">Analyze</button>
    </form>

    <hr>

    <!-- URL Detection -->
    <form method="POST">
        <h3>URL Threat Detection</h3>
        <input type="text" name="url" placeholder="Enter URL" required>
        <button type="submit" name="classify_url">Classify</button>
    </form>

    {% if result %}
    <div class="result">
        {{ result }}
    </div>
    {% endif %}
</div>

</body>
</html>
