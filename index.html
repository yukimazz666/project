<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreatGuard - URL Threat Detector</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Background image */
            background: url('https://wallpapercat.com/w/full/8/f/0/2127810-3840x2160-desktop-4k-internet-wallpaper-photo.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        /* Add overlay to make text readable */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
            z-index: -1;
        }

        .wrapper {
            width: 100%;
            text-align: center;
            position: absolute;
            top: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #4fa3ff;
        }

        .card {
            background: rgba(27, 27, 47, 0.9); /* semi-transparent card */
            width: 420px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
        }

        h2 {
            margin-bottom: 15px;
            font-size: 20px;
        }

        input[type="file"],
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #3a3a5a;
            background: #101020;
            color: white;
            margin-bottom: 15px;
        }

        input::placeholder {
            color: #aaaaaa;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #2ecc71;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #27ae60;
        }

        .section {
            margin-bottom: 30px;
        }

        .result {
            margin-top: 15px;
            color: #00ffcc;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="wrapper">ThreatGuard</div>

<div class="card">

    <!-- File Upload Section -->
    <div class="section">
        <h2>Malicious Files</h2>
        <form>
            <input type="file" accept=".pdf,.txt">
            <button type="button">Analyze</button>
        </form>
    </div>

    <!-- URL Detection Section -->
    <div class="section">
        <h2>URL Threat Detection</h2>
        <form>
            <input type="text" placeholder="Enter URL">
            <button type="button">Classify</button>
        </form>
        <div class="result">
            URL: https://www.linkedin.com
        </div>
    </div>

</div>

</body>
</html>
