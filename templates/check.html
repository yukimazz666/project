<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreatGuard</title>

    <style>
        body {
            background: url("{{ url_for('static', filename='img/network.jpeg') }}") no-repeat center center fixed;
            background-size: cover;
            font-family: Arial, sans-serif;
            color: white;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 420px;
            margin: 60px auto;
            background: rgba(17, 24, 39, 0.95);
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 0 25px rgba(0,0,0,0.7);
        }

        h1 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 20px;
        }

        h3 {
            margin-top: 10px;
            color: #a5f3fc;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
        }

        input {
            background: #020617;
            color: white;
        }

        button {
            background: #22c55e;
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #16a34a;
        }

        hr {
            margin: 25px 0;
            border: 1px solid #1e293b;
        }

        .logout-box {
            display: flex;
            justify-content: right;
            margin: 10px 15px;
        }

        .logout-btn {
            background-color: #2ecc71;
            color: black;
            border: none;
            padding: 10px 25px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: auto;
            margin-left: 10px;
        }

        .logout-btn:hover {
            background-color: #27ae60;
        }

        .result {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            white-space: pre-line;
        }

        /* Dynamic colors */
        .safe {
            background: #022c22;
            border-left: 5px solid #22c55e;
        }

        .danger {
            background: #2c0202;
            border-left: 5px solid #ef4444;
        }

        .warning {
            background: #2c1f02;
            border-left: 5px solid #facc15;
        }

        @media (max-width: 480px) {
            .container {
                margin: 30px 15px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <h1>ThreatGuard</h1>

    <!-- FILE DETECTION -->
    <form method="POST" enctype="multipart/form-data">
        <h3>📄 Malicious File Detection</h3>
        <input type="file" name="file" accept=".pdf" required>
        <button type="submit" name="action" value="analyze_file">Analyze File</button>
    </form>

    <hr>

    <!-- URL DETECTION -->
    <form method="POST" onsubmit="formatURL()">
        <h3>🌐 URL Threat Detection</h3>
        <input id="urlInput" type="text" name="url" placeholder="https://example.com" required>
        <button type="submit" name="action" value="classify_url">Classify URL</button>
    </form>

    {% if result %}
    <div class="result 
        {% if 'HIGH RISK' in result or 'Malicious' in result %}
            danger
        {% elif 'SUSPICIOUS' in result or '⚠' in result %}
            warning
        {% else %}
            safe
        {% endif %}
    ">
        {{ result }}
    </div>
    {% endif %}
</div>

<!-- Buttons -->
<div style="display:flex; justify-content:center; gap:10px;">
    <form action="{{ url_for('index') }}" method="GET">
        <button class="logout-btn" type="submit">⬅ Back</button>
    </form>

    <form action="{{ url_for('logout') }}" method="POST">
        <button class="logout-btn" type="submit">Logout</button>
    </form>
</div>

<script>
function formatURL() {
    let input = document.getElementById("urlInput");
    let value = input.value.trim();

    if (!value.startsWith("http")) {
        input.value = "http://" + value;
    }
}
</script>

</body>
</html>
