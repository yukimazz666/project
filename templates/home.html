<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreatGuard</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-image: url("{{ url_for('static', filename='bg.jpg') }}");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
        }

        .content {
            position: relative;
            text-align: center;
            color: white;
            padding: 25px;
            max-width: 420px;
        }

        h1 {
            font-size: 2.3rem;
            margin-bottom: 10px;
            color: #38bdf8;
        }

        p {
            font-size: 1.05rem;
            margin-bottom: 25px;
            color: #e5e7eb;
        }

        .btn {
            display: inline-block;
            padding: 14px 30px;
            background: #22c55e;
            color: #020617;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.25s ease;
        }

        .btn:hover {
            background: #16a34a;
            transform: scale(1.05);
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>

<div class="overlay"></div>

<div class="content">
    <h1>ThreatGuard</h1>
    <p>Detect malicious URLs and files easily</p>
    <a href="{{ url_for('login') }}" class="btn">Get Started</a>
</div>

</body>
</html>
