<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ThreatGuard | Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #1e293b;
            color: #ffffff;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background-color: #020617;
        }

        .navbar h2 {
            margin: 0;
            color: #38bdf8;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
        }

        .navbar a:hover {
            color: #38bdf8;
        }

        /* Hero Section */
        .hero {
            height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex-direction: column;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 48px;
            color: #38bdf8;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 18px;
            max-width: 600px;
            margin-bottom: 25px;
            color: #e5e7eb;
        }

        .btn {
            background-color: #22c55e;
            color: #000;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #16a34a;
        }

        /* Footer */
        footer {
            background-color: #020617;
            text-align: center;
            padding: 12px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <h2>ThreatGuard</h2>
        <div>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
    </div>

    <!-- Hero Section -->
    <section class="hero">
        <h1>ThreatGuard</h1>
        <p>
            Detect malicious URLs and spam PDF files using intelligent threat analysis.
            Stay safe from phishing, malware, and cyber threats.
        </p>
        <a href="{{ url_for('start') }}" class="btn">Get Started</a>
    </section>

    <!-- Footer -->
    <footer>
        © 2026 ThreatGuard | Cybersecurity Web Application
    </footer>

</body>
</html>
