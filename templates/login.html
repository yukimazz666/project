<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
* { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; background: #020617; }

canvas#bgCanvas { position: fixed; top: 0; left: 0; z-index: -1; }

.login-box {
    width: 100%;
    max-width: 350px;
    background: rgba(0, 0, 0, 0.75);
    padding: 25px;
    border-radius: 10px;
    color: #fff;
    position: relative;
    z-index: 1;
}

.login-box h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
.login-box input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    background: #020617;
    color: white;
}
.login-box button {
    width: 100%;
    padding: 12px;
    background: #22c55e;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    color: #020617;
    cursor: pointer;
    transition: 0.2s;
}
.login-box button:hover { background: #16a34a; }

.register-text a { color: #00bfff; }
.login-box p { text-align: center; margin-top: 12px; font-size: 13px; color: #ee6617; }
.google-btn {
    display: block;
    text-align: center;
    padding: 14px;
    background: #4285F4;
    color: white;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    margin-bottom: 10px;
}
@media (max-width: 480px) { .login-box { margin: 15px; } }
</style>
</head>
